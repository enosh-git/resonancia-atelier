<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Prata&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Resonancia Atelier</title>
  </head>
  <body>
      <header class="header">
        <div class="header-logo">
          <a href="index.html">
            <img src="img/logo.png" alt="Resonancia Atelier Logo" class="headerLogo">
          </a>
        </div>

        <nav class="nav">
          <ul class="navList">
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </header>

      <main>
        <!-- Hero section -->
         <section class="hero">
            <div class="hero__slider" id="heroSlider">
              <img src="img/hero1.png" alt="Modern Cafe Design" class="hero__slide hero__slide--active">
              <img src="img/hero2.png" alt="Modern House Outside View" class="hero__slide">
              <img src="img/hero3.png" alt="Modern House Outside View With 3 Cars" class="hero__slide">

              <button class="hero__arrow hero__arrow--prev" id="prevSlide" aria-label="Previous slide">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>

              <button class="hero__arrow hero__arrow--next" id="nextSlide" aria-label="Next slide">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>

         </section>

      </main>
      <script src="js/main.js"></script>
  </body>
</html>
